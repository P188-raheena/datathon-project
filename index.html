<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction Using Machine Learning</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🩺 Diabetes Prediction System</h1>

            <p class="subtitle">
                Predict whether a person is diabetic using Machine Learning.
            </p>

            <form action="/predict" method="POST">

                <div class="input-group">

                    <label>Pregnancies</label>
                    <input type="number" name="Pregnancies" required>

                </div>

                <div class="input-group">

                    <label>Glucose Level</label>
                    <input type="number" name="Glucose" required>

                </div>

                <div class="input-group">

                    <label>Blood Pressure</label>
                    <input type="number" name="BloodPressure" required>

                </div>

                <div class="input-group">

                    <label>Skin Thickness</label>
                    <input type="number" name="SkinThickness" required>

                </div>

                <div class="input-group">

                    <label>Insulin</label>
                    <input type="number" name="Insulin" required>

                </div>

                <div class="input-group">

                    <label>BMI</label>
                    <input type="text" name="BMI" required>

                </div>

                <div class="input-group">

                    <label>Diabetes Pedigree Function</label>
                    <input type="text" name="DiabetesPedigreeFunction" required>

                </div>

                <div class="input-group">

                    <label>Age</label>
                    <input type="number" name="Age" required>

                </div>

                <button type="submit">
                    Predict Diabetes
                </button>

            </form>

        </div>

    </div>

</body>

</html>
